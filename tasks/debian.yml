---
# Debian/Ubuntu specific tasks for Docker installation

- name: Update apt package index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
    state: present

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ _docker_gpg_key_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: true
  register: _docker_gpg_key_download

- name: Remove legacy Docker repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Add Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - "{{ _docker_repo_url }}"
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - "{{ docker_release_channel }}"
    architectures:
      - >-
        {{
          _docker_arch_mapping[ansible_facts['architecture']]
          | default(ansible_facts['architecture'])
        }}
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  register: _docker_repository

- name: Update apt package index after repository change # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when: _docker_repository is changed

- name: Remove old Docker packages if present
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - docker-buildx
      - podman-docker
      - containerd
      - runc
    state: absent
  when: not _docker_installed.stat.exists
