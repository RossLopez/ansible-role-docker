---
# RedHat/CentOS/Rocky/Alma Linux specific tasks for Docker installation

- name: Install prerequisite packages
  ansible.builtin.dnf:
    name:
      - dnf-plugins-core
      - ca-certificates
    state: present
  when: ansible_facts['pkg_mgr'] == 'dnf'

- name: Install prerequisite packages (YUM)
  ansible.builtin.dnf:
    name:
      - yum-utils
      - ca-certificates
    state: present
  when: ansible_facts['pkg_mgr'] == 'yum'

- name: Remove old Docker packages if present
  ansible.builtin.package:
    name:
      - docker
      - docker-client
      - docker-client-latest
      - docker-common
      - docker-latest
      - docker-latest-logrotate
      - docker-logrotate
      - docker-engine
      - podman
      - runc
    state: absent
  when: not _docker_installed.stat.exists

- name: Import Docker GPG key
  ansible.builtin.rpm_key:
    key: "{{ _docker_gpg_key_url }}"
    state: present

- name: Add Docker repository
  ansible.builtin.yum_repository:
    name: "docker-ce-{{ docker_release_channel }}"
    description: "Docker CE {{ docker_release_channel | capitalize }} - {{ ansible_facts['architecture'] }}"
    baseurl: >-
      {{
        _docker_repo_url
        ~ '/' ~ ansible_facts['distribution_major_version']
        ~ '/' ~ ansible_facts['architecture']
        ~ '/' ~ docker_release_channel
      }}
    gpgcheck: true
    gpgkey: "{{ _docker_gpg_key_url }}"
    enabled: true
